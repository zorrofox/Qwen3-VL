# Qwen3-VL 8B 训练 Job — GKE TPU v7x (Ironwood)，16 JAX 设备（tpu7x-16）
#
# 硬件规格（tpu7x-16）：
#   2 VM × 4 物理芯片 × 2 逻辑核 = 16 JAX devices，拓扑 2x2x2
#   机器类型：tpu7x-standard-4t（每节点 8 JAX devices）
#   内存：每节点约 983 GB（远大于 v6e 的 128 GB）
#
# 与 v6e-16 的关键差异：
#   v6e-16: 4 nodes × 4 JAX dev = 16 total，gke-accelerator=tpu-v6e-slice，topology=4x4
#   tpu7x-16: 2 nodes × 8 JAX dev = 16 total，gke-accelerator=tpu7x，topology=2x2x2
#   多 host 均需 workload policy（v6e 不需要，v7x 必须）
#   JAX 版本不锁定（v7x 需要支持 Ironwood 的版本）
#
# 前提（一次性设置）：
#   # 1. 获取集群凭据 + 添加 IP 到授权网络
#   gcloud container clusters get-credentials bodaborg-tpu7x-auto-nap2 \
#     --region=us-central1 --project=cloud-tpu-multipod-dev
#   MY_IP=$(curl -s ifconfig.me)
#   gcloud container clusters update bodaborg-tpu7x-auto-nap2 --region=us-central1 \
#     --enable-master-authorized-networks \
#     --master-authorized-networks="${MY_IP}/32,<existing_cidrs>"
#
#   # 2. 创建 workload policy（已创建：grhuang-tpu7x-2x2x2）
#   gcloud beta compute resource-policies create workload-policy grhuang-tpu7x-2x2x2 \
#     --type=HIGH_THROUGHPUT --accelerator-topology=2x2x2 \
#     --project=cloud-tpu-multipod-dev --region=us-central1
#
#   # 3. 上传代码
#   tar czf /tmp/jax_qwenvl.tar.gz jax_qwenvl/ && \
#   gcloud storage cp /tmp/jax_qwenvl.tar.gz gs://grhuang-02-vertex-ai/code/
#
#   # 4. 授权 cloud-tpu-multipod-dev 节点 SA 访问 GCS
#   gcloud storage buckets add-iam-policy-binding gs://grhuang-02-vertex-ai \
#     --member="serviceAccount:706422770546-compute@developer.gserviceaccount.com" \
#     --role="roles/storage.objectAdmin"
#   # （已完成：SA 已有 roles/storage.objectAdmin）
#
# 提交：
#   kubectl apply -f qwen3vl-8b-v7x-train-job.yaml
#   kubectl logs -l job-name=qwen3vl-8b-v7x-train --follow
#   kubectl delete -f qwen3vl-8b-v7x-train-job.yaml

apiVersion: v1
kind: Service
metadata:
  name: qwen3vl-v7x-headless-svc
spec:
  clusterIP: None
  selector:
    job-name: qwen3vl-8b-v7x-train
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3vl-8b-v7x-train
spec:
  backoffLimit: 0
  completions: 2       # tpu7x-16 = 2 VM × 4 chips × 2 cores = 16 JAX devices
  parallelism: 2
  completionMode: Indexed
  template:
    spec:
      subdomain: qwen3vl-v7x-headless-svc  # 必须与 Service name 一致
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu7x      # v7x 加速器标签
        cloud.google.com/gke-tpu-topology: 2x2x2          # tpu7x-16: 2 hosts, 16 JAX dev
        cloud.google.com/placement-policy-name: grhuang-tpu7x-2x2x2  # 多 host 必须
      serviceAccountName: grhuang-trainer-ksa   # Workload Identity → grhuang-tpu-trainer GSA
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: trainer
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:latest
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          echo "=== [$(date)] Pod ${JOB_COMPLETION_INDEX} starting on v7x ==="

          # 1. 下载代码
          echo "=== [$(date)] Downloading jax_qwenvl code ==="
          mkdir -p /workspace && cd /workspace
          gcloud storage cp gs://grhuang-02-vertex-ai/code/jax_qwenvl.tar.gz .
          tar xzf jax_qwenvl.tar.gz

          # 2. 安装 Python 3.11 + 依赖
          # 注意：不锁 jax[tpu] 版本，使用 TPU releases 中支持 v7x(Ironwood) 的版本
          echo "=== [$(date)] Installing Python 3.11 and dependencies ==="
          apt-get update -qq
          apt-get install -y -qq python3.11 python3.11-venv python3.11-dev
          python3.11 -m venv /opt/venv311
          source /opt/venv311/bin/activate

          # 与 v6e 完全相同的安装方式：先装 JAX，再装 requirements.txt（含 torchvision CPU 版）
          # JAX 0.9.0 已验证支持 v7x（Ironwood），每节点 8 JAX 设备
          pip install --quiet "jax[tpu]==0.9.0" \
            -f https://storage.googleapis.com/jax-releases/libtpu_releases.html
          pip install --quiet -r jax_qwenvl/requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

          echo "=== JAX version: $(python3 -c 'import jax; print(jax.__version__)') ==="

          # 3. 从 GCS 下载模型（避免 HuggingFace CDN/Xet 问题）
          echo "=== [$(date)] Downloading model from GCS ==="
          mkdir -p /workspace/model
          gcloud storage cp -r gs://grhuang-02-vertex-ai/models/Qwen3-VL-8B-Instruct/qwen3vl-8b /workspace/model/
          echo "=== [$(date)] Model ready: $(ls /workspace/model/qwen3vl-8b/*.safetensors 2>/dev/null | wc -l) safetensors files ==="

          # 4. 下载数据集
          echo "=== [$(date)] Downloading dataset ==="
          mkdir -p /data/llava
          gcloud storage cp \
            gs://grhuang-02-vertex-ai/datasets/llava_data/llava_instruct_150k.json \
            /data/llava/
          gcloud storage cp \
            gs://grhuang-02-vertex-ai/datasets/llava_data/train2017.zip \
            /data/llava/
          echo "=== [$(date)] Unzipping train2017.zip ==="
          python3 -c "import zipfile; zipfile.ZipFile('/data/llava/train2017.zip').extractall('/data/llava/')"
          echo "=== [$(date)] Dataset ready ==="

          # 5. 训练（模型从本地 GCS 副本加载，跳过 HuggingFace 下载）
          # FSDP_DEVICES=4：与 v6e-16 完全相同的 dp=4,fsdp=4 mesh（验证 checkpoint 是否正常）
          # 注：v7x 每 host 8 JAX dev，fsdp=4 会跨 host 边界，但 Orbax 2-process allgather 有 bug
          source /opt/venv311/bin/activate
          cd /workspace
          MODEL_PATH=/workspace/model/qwen3vl-8b \
          DATASETS=llava_instruct_150k \
          LLAVA_DATA_ROOT=/data/llava \
          BATCH_SIZE=2 \
          FSDP_DEVICES=4 \
          MAX_STEPS=30 \
          MAX_PIXELS=50176 \
          MODEL_MAX_LENGTH=8192 \
          GCS_OUTPUT_DIR=gs://grhuang-02-vertex-ai/qwen3vl-8b-v7x-test \
          REPORT_TO=tensorboard \
          RUN_NAME=qwen3vl-8b-v7x16-L8192-bench \
          SAVE_STEPS=9999 \
          bash jax_qwenvl/scripts/train_tpu.sh

        env:
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: TF_CPP_MIN_LOG_LEVEL
          value: "0"
        - name: HF_TOKEN
          value: "${HF_TOKEN}"  # 从 Kubernetes Secret 或环境变量注入，禁止硬编码
        - name: HF_HUB_ENABLE_HF_TRANSFER
          value: "1"
        resources:
          requests:
            google.com/tpu: 4    # 仅请求 TPU，不请求 CPU/memory（避免 optimize-utilization-scheduler 注入 cpu-np nodeSelector）
          limits:
            google.com/tpu: 4
