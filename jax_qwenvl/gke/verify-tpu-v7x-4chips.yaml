# TPU v7x 单 host 验证 Job（4 chips，无需 workload policy）
#
# 用途：在 YOUR_GKE_CLUSTER 集群验证 v7x 节点可用性
#
# 前提：
#   gcloud container clusters get-credentials YOUR_GKE_CLUSTER \
#     --region=us-central1 --project=YOUR_GCP_PROJECT
#
# 提交：
#   kubectl apply -f verify-tpu-v7x-4chips.yaml
#   kubectl logs -l job-name=verify-tpu-v7x --follow
#   kubectl delete -f verify-tpu-v7x-4chips.yaml
#
# 说明：
#   - tpu7x-8（xpk 命名）= 1 VM × 4 chips = 4 chips 单 host，无 workload policy
#   - 与 v6e 不同，v7x 多 host（tpu7x-32 = 16 chips）需要 workload policy
#   - gke-tpu-accelerator 标签值为 "tpu7x"（非 "tpu-v7x-slice"）

apiVersion: v1
kind: Service
metadata:
  name: verify-v7x-headless-svc
spec:
  clusterIP: None
  selector:
    job-name: verify-tpu-v7x
---
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-tpu-v7x
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  completionMode: Indexed
  template:
    spec:
      subdomain: verify-v7x-headless-svc
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu7x        # v7x 标签（非 tpu-v7x-slice）
        cloud.google.com/gke-tpu-topology: 2x2x1           # tpu7x-8: 1 VM, 4 chips, 无需 policy
      containers:
      - name: tpu-job
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:latest
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          echo "=== JAX version ==="
          python3 -c "import jax; print('JAX:', jax.__version__)"
          echo "=== TPU device check ==="
          python3 -c "
          import jax
          # 单 host 无需 jax.distributed.initialize()
          total = jax.device_count()
          local = jax.local_device_count()
          print(f'local_devices={local}, total_devices={total}')
          assert total == 4, f'Expected 4 TPU devices (tpu7x-8 single host), got {total}'
          print('PASS: 4 v7x chips available')
          "
        resources:
          requests:
            google.com/tpu: 4
          limits:
            google.com/tpu: 4
