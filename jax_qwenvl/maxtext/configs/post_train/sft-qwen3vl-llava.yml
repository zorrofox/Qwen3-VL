# SFT config for Qwen3-VL-8B on LLaVA-Instruct-150K
# Based on: sft-vision-chartqa.yml

base_config: "base.yml"

use_sft: True
use_tunix_gradient_accumulation: True
use_multimodal: True
sft_train_on_completion_only: True   # 只在 completion（GPT 回答）上计算 loss
packing: False
freeze_vision_encoder_params: True   # SFT 时冻结视觉编码器
learning_rate: 2.0e-5

# ── Data Pipeline ──────────────────────────────────────────────────────────
# 自定义 HuggingFace dataset builder，读取 GCS 上的 LLaVA JSON + COCO 图片
# 无需预转换数据，直接从原始格式加载
dataset_type: hf
hf_path: "jax_qwenvl/maxtext/data/llava_dataset.py"
train_split: "train"
hf_eval_split: "validation"
train_data_columns: ["query", "label"]
eval_data_columns: ["query", "label"]

# LLaVA 数据在 GCS 的路径（通过环境变量传入）
# 训练命令示例：
#   python3 -m maxtext.trainers.post_train.sft.train_sft \
#     jax_qwenvl/maxtext/configs/post_train/sft-qwen3vl-llava.yml \
#     llava_json_path=gs://YOUR_GCS_BUCKET/datasets/llava_data/llava_instruct_150k.json \
#     llava_image_dir=gs://YOUR_GCS_BUCKET/datasets/llava_data/train2017 \
#     load_parameters_path=gs://YOUR_GCS_BUCKET/models/Qwen3-VL-8B-Instruct/qwen3vl-8b \
#     base_output_directory=gs://YOUR_GCS_BUCKET/qwen3vl-maxtext-sft \
#     run_name=qwen3vl-8b-llava-sft \
#     per_device_batch_size=2 \
#     max_target_length=1024
